<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Octopus · multi-agent NIM console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root{
    --abyss:#04141d; --deep:#0a2430; --ridge:#123c4e; --edge:#1b5064;
    --text:#dcf0f4; --muted:#6f95a3; --glow:#7ff2e0;
    --writer:#f2b56b; --coder:#5fd8d1; --scheduler:#a98cff; --imager:#ff8a7a; --analyst:#9fe86a;
    --display:"Space Grotesk",system-ui,sans-serif;
    --body:"Inter",system-ui,-apple-system,sans-serif;
    --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:
      radial-gradient(1300px 700px at 50% -12%, #0e3546 0%, transparent 62%),
      radial-gradient(900px 500px at 12% 105%, #0b2f3e 0%, transparent 60%),
      var(--abyss);
    color:var(--text);font-family:var(--body);font-size:15px;line-height:1.55;
    -webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}

  /* drifting motes, purely atmospheric */
  .motes{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5}
  .mote{position:absolute;border-radius:50%;background:var(--glow);filter:blur(1px);
        animation:drift linear infinite}
  @keyframes drift{
    0%{transform:translateY(20vh) translateX(0);opacity:0}
    10%{opacity:.5} 90%{opacity:.4}
    100%{transform:translateY(-110vh) translateX(28px);opacity:0}}

  .wrap{max-width:1120px;margin:0 auto;padding:28px 20px 90px;position:relative;z-index:1}

  header{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:baseline;
         justify-content:space-between;margin-bottom:18px}
  .brand{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:-.02em;margin:0}
  .brand em{font-style:normal;color:var(--glow);text-shadow:0 0 18px #7ff2e066}
  .stat{font-family:var(--mono);font-size:12px;color:var(--muted)}
  .stat a{color:var(--muted)}

  /* ---- live counters ---- */
  .hud{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 6px}
  .pill{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;
    color:var(--muted);background:#08202880;border:1px solid var(--ridge);
    border-radius:20px;padding:5px 12px;transition:color .3s,border-color .3s}
  .pill b{color:var(--glow);font-weight:500;font-variant-numeric:tabular-nums}
  .pill.hot{border-color:var(--glow);color:var(--text)}

  /* ---- the studio ---- */
  .creature{position:relative;margin:0 auto 4px;max-width:660px}
  svg.office{width:100%;height:auto;display:block;overflow:visible}
  svg.office.working .moon{opacity:.9}
  svg.office.working .window rect{stroke:#2a6d85}
  .sign{font-family:var(--mono);font-size:8px;fill:var(--muted);letter-spacing:.14em}
  .moon{animation:glow 6s ease-in-out infinite}
  .stars circle{animation:twinkle 4s ease-in-out infinite}
  .stars circle:nth-child(2){animation-delay:1.1s}
  .stars circle:nth-child(3){animation-delay:2.3s}
  .stars circle:nth-child(4){animation-delay:3.1s}
  @keyframes twinkle{0%,100%{opacity:.25}50%{opacity:.9}}
  @keyframes glow{0%,100%{opacity:.5}50%{opacity:.8}}
  .clock .hand-m{transform-origin:0 0;animation:spin 12s linear infinite}
  .clock .hand-h{transform-origin:0 0;animation:spin 144s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .plant path{transform-origin:bottom center;animation:sway 7s ease-in-out infinite}
  @keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}

  /* a desk appears only when someone is using it */
  .desk .top{fill:#8d6640;stroke:#a87c4f;stroke-width:1}
  .desk .leg{fill:#5a4232}
  .desk .mon{fill:#0b1e28;stroke:#3f6b80;stroke-width:1}
  .desk .mug{fill:#ff9b8f}
  .desk .paper{fill:#eae2d0;opacity:.85}
  .desk .glare{fill:currentColor;opacity:0}
  .desk.busy .glare{opacity:.5;animation:flicker 1.6s ease-in-out infinite}
  .desk.done .glare{opacity:.22}
  .desk.failed .glare{opacity:.14;fill:#ff9b8f}
  @keyframes flicker{0%,100%{opacity:.28}50%{opacity:.6}}

  /* the person: walks in from the door, then sits and works */
  .person{transition:transform 1.15s cubic-bezier(.34,.8,.36,1)}
  .person .shadow{fill:#04141d;opacity:.45}
  .person .torso{fill:currentColor}
  .person .head{fill:#f0c9a0}
  .person .hair{fill:#3a2a24}
  .person .chair{fill:#2b5f75;stroke:#3f819c;stroke-width:1}
  .person .arm2{stroke:currentColor;stroke-width:2.4;stroke-linecap:round}
  .person.busy .torso{animation:type 1.1s ease-in-out infinite}
  @keyframes type{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.1px)}}
  .person.done .torso{transform:translateY(1px)}
  .person.failed{opacity:.55}
  .person .tag{font-family:var(--mono);font-size:7.5px;fill:var(--muted);letter-spacing:.02em}
  .person.busy .tag,.person.done .tag{fill:var(--text)}
  .person .prov2{font-family:var(--mono);font-size:6.5px;letter-spacing:.06em}
  .person .mark{font-size:9px;opacity:0;transition:opacity .4s}
  .person.done .mark,.person.failed .mark{opacity:1}
  /* a little lamp pool under whoever is actually working */
  .person .pool{fill:url(#lamp);opacity:0;transition:opacity .5s}
  .person.busy .pool{opacity:1}

  /* ---- task bar ---- */
  .console{background:linear-gradient(180deg,#0b2836,#082129);border:1px solid var(--ridge);
    border-radius:14px;padding:18px;margin-bottom:18px;
    box-shadow:0 18px 50px -30px #000, inset 0 1px 0 #ffffff08}
  textarea{width:100%;background:#061a24;color:var(--text);border:1px solid var(--ridge);
    border-radius:10px;padding:13px 15px;font:inherit;min-height:80px;resize:vertical;
    transition:border-color .25s,box-shadow .25s}
  textarea:focus{outline:none;border-color:var(--glow);box-shadow:0 0 0 3px #7ff2e022}
  .bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:12px}
  .hint{font-family:var(--mono);font-size:11px;color:var(--muted);flex:1;min-width:200px}
  button.go{font-family:var(--display);font-weight:700;font-size:15px;background:var(--glow);
    color:#03222a;border:0;border-radius:10px;padding:11px 28px;cursor:pointer;
    transition:transform .15s,box-shadow .25s,opacity .2s;box-shadow:0 0 26px -6px #7ff2e0}
  button.go:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 0 34px -4px #7ff2e0}
  button.go:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
  button.go:focus-visible{outline:2px solid var(--glow);outline-offset:3px}
  .why{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:11px;min-height:1.2em}
  button.ghost{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;
    background:transparent;color:var(--muted);border:1px solid var(--ridge);border-radius:8px;
    padding:9px 14px;cursor:pointer;transition:color .2s,border-color .2s}
  button.ghost:hover{color:var(--text);border-color:var(--edge)}
  /* Queued work, so submitting while a run is going is visibly accepted rather than
     silently swallowed. */
  .queue{margin-top:10px;display:flex;flex-direction:column;gap:5px}
  .queue .q{display:flex;gap:9px;align-items:baseline;font-family:var(--mono);font-size:11.5px;
    color:var(--muted);background:#08202880;border:1px solid var(--ridge);
    border-radius:8px;padding:7px 11px;animation:rise .3s ease both}
  .queue .q b{color:var(--glow);font-weight:500}
  .queue .q .drop{margin-left:auto;cursor:pointer;color:var(--muted);opacity:.7}
  .queue .q .drop:hover{color:#ff9b8f;opacity:1}
  .memo{font-family:var(--mono);font-size:11px;color:var(--muted);opacity:.75;margin-top:6px}
  button.ghost.rec{color:#ff9b8f;border-color:#ff9b8f;animation:pulse 1.2s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.55}}
  /* Play an answer aloud. Sits in the card header next to the model name. */
  .card h3 .say{margin-left:6px;cursor:pointer;color:var(--muted);font-size:12px;
    background:none;border:0;padding:0;transition:color .2s}
  .card h3 .say:hover{color:var(--glow)}
  /* One tangle per task. Concurrent runs each get their own group, so two pools on screen
     at once stay legible instead of interleaving their cards. */
  .tangle{border:1px solid var(--ridge);border-radius:14px;padding:14px;margin-bottom:16px;
    background:#07202a66;animation:rise .4s ease both}
  .tangle.live{border-color:var(--edge);box-shadow:0 0 0 1px #7ff2e01a}
  .tangle > h2{font-family:var(--display);font-size:14px;margin:0 0 10px;display:flex;
    gap:10px;align-items:baseline;flex-wrap:wrap;color:var(--text)}
  .tangle > h2 .tno{font-family:var(--mono);font-size:10px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--glow);border:1px solid currentColor;
    border-radius:20px;padding:1px 8px}
  .tangle > h2 .tstate{font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:auto}
  .tangle .inner{display:grid;gap:12px}
  .why .tag{color:var(--glow)}

  /* ---- results ---- */
  .results{display:grid;gap:14px}
  .wavebar{display:flex;align-items:center;gap:12px;margin:8px 0 2px;
    font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--muted);animation:rise .5s ease both}
  .wavebar::after{content:"";flex:1;height:1px;
    background:linear-gradient(90deg,var(--ridge),transparent)}
  .wavebar b{color:var(--glow);font-weight:500}

  .card{background:linear-gradient(180deg,#0a242e,#071c24);border:1px solid var(--ridge);
    border-left:3px solid var(--c);border-radius:12px;overflow:hidden;
    animation:rise .5s cubic-bezier(.2,.7,.3,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(14px) scale(.99)}
                  to{opacity:1;transform:none}}
  .card.busy{box-shadow:0 0 0 1px color-mix(in srgb,var(--c) 40%,transparent),
                        0 12px 40px -26px var(--c)}
  .card h3{font-family:var(--display);font-size:15px;margin:0;padding:12px 15px;
    display:flex;flex-wrap:wrap;gap:9px;align-items:baseline;border-bottom:1px solid #0f3341}
  .card h3 .who{color:var(--c)}
  .card h3 .role{font-family:var(--mono);font-size:10px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--c);opacity:.75;border:1px solid currentColor;
    border-radius:20px;padding:1px 7px}
  .card h3 .mdl{font-family:var(--mono);font-size:11px;color:var(--muted);font-weight:400}
  /* Which machine answered. Worth a colour of its own: the whole point of the router is
     that two agents on the same screen can have come from completely different places. */
  .card h3 .prov{font-family:var(--mono);font-size:10px;letter-spacing:.08em;
    text-transform:uppercase;border-radius:4px;padding:2px 6px;font-weight:600}
  /* Unknown providers still render — the neutral .prov styling above is the default,
     and a new registry row gets a readable chip without touching this file. */
  .prov[data-p="local"]{background:#12313f;color:#8ab4f8;border:1px solid #24506b}
  .prov[data-p="nvidia"]{background:#1b2c0d;color:#a8e63a;border:1px solid #3c5f14}
  .prov[data-p="gemini"]{background:#2a1c3d;color:#c9a6ff;border:1px solid #4b3170}
  .prov{background:#132a33;color:var(--muted);border:1px solid var(--ridge)}
  .card h3 .rwhy{font-family:var(--mono);font-size:10.5px;color:var(--muted);opacity:.8;
    flex-basis:100%;margin-top:-2px}
  .card h3 .ms{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted);
    font-variant-numeric:tabular-nums}
  .card .out{padding:14px 16px;white-space:pre-wrap;word-break:break-word;
    max-height:440px;overflow:auto}
  .card.busy .out::after{content:"▋";color:var(--c);animation:caret 1s steps(2) infinite}
  @keyframes caret{50%{opacity:0}}
  .card .out:empty::after{content:"reaching into the dark…";color:var(--muted);
    font-family:var(--mono);font-size:12px;
    background:linear-gradient(90deg,var(--muted),var(--glow),var(--muted));
    background-size:200% 100%;-webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;animation:shimmer 2.4s linear infinite}
  @keyframes shimmer{to{background-position:-200% 0}}
  .card pre{background:#04161d;border:1px solid #0f3341;border-radius:8px;padding:12px;
    overflow:auto;font-family:var(--mono);font-size:12.5px;line-height:1.6;white-space:pre}
  .card code{font-family:var(--mono);font-size:.92em;background:#04161d;padding:1px 5px;border-radius:4px}
  .card img{max-width:100%;border-radius:8px;display:block}
  .fail{color:#ff9b8f;font-family:var(--mono);font-size:12.5px}
  /* Where a research agent actually read. Shown before the answer streams, because the
     first question about any sourced answer is which pages it came from. */
  .srcs{font-family:var(--mono);font-size:11px;color:var(--muted);padding:9px 15px;
    border-bottom:1px solid #0f3341;background:#061c25}
  .srcs b{color:var(--glow);font-weight:500}
  .srcs a{color:#6ec8ff;text-decoration:none;display:block;margin-top:3px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .srcs a:hover{text-decoration:underline}
  .srcs .miss{color:#ff9b8f}
  table.plan{width:100%;border-collapse:collapse;font-size:13.5px}
  table.plan td{padding:8px 10px;border-top:1px solid #0f3341;vertical-align:top}
  table.plan td.when{font-family:var(--mono);font-size:12px;color:var(--c);white-space:nowrap}
  table.plan td.dur{font-family:var(--mono);font-size:11.5px;color:var(--muted);
    white-space:nowrap;text-align:right}
  .assume{font-size:12.5px;color:var(--muted);padding:10px 0 0}

  /* ---- catalog ---- */
  details.cat{margin-top:24px;border:1px solid var(--ridge);border-radius:12px;background:#08202880}
  details.cat summary{cursor:pointer;padding:13px 16px;font-family:var(--mono);font-size:12px;
    letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .fam{padding:0 16px 16px}
  .fam h4{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--glow);margin:14px 0 7px}
  .fam ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
  .fam li{font-family:var(--mono);font-size:11.5px;color:var(--muted);background:#04161d;
    border:1px solid #0f3341;border-radius:6px;padding:4px 8px}
  .binding{font-family:var(--mono);font-size:11.5px;color:var(--muted);padding:2px 0}
  .binding b{color:var(--text);font-weight:500}

  @media(prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none !important;transition:none !important}
    .arm{stroke-dashoffset:0 !important}
    .limb.busy .flow{opacity:.5}
    .motes{display:none}
  }
</style>
</head>
<body>
<div class="motes" id="motes" aria-hidden="true"></div>
<div class="wrap">

  <header>
    <h1 class="brand">Oct<em>o</em>pus</h1>
    <div class="stat" id="stat">reading your model catalog…</div>
  </header>

  <div class="hud" id="hud" aria-live="polite">
    <span class="pill">agents <b id="m-agents">0</b></span>
    <span class="pill">running <b id="m-live">0</b></span>
    <span class="pill">waves <b id="m-waves">0</b></span>
    <span class="pill">done <b id="m-done">0</b></span>
    <span class="pill" id="p-failed" hidden>failed <b id="m-failed">0</b></span>
    <span class="pill">elapsed <b id="m-time">0s</b></span>
  </div>

  <div class="creature">
    <!-- The studio. Each running agent is a person at a desk: they walk in through the
         door, sit down, work while their monitor glows in their role's colour, and lean
         back when they finish. It is the same information the old tentacles carried —
         who is working, on what, where — in a form that reads at a glance. -->
    <svg class="office" viewBox="0 0 620 330" xmlns="http://www.w3.org/2000/svg"
         aria-label="Agents at work in the studio, one person per running agent">
      <defs>
        <linearGradient id="floorg" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#3a2a20"/><stop offset="100%" stop-color="#241a14"/>
        </linearGradient>
        <linearGradient id="wallg" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#123246"/><stop offset="100%" stop-color="#17415a"/>
        </linearGradient>
        <radialGradient id="lamp" cx="50%" cy="0%">
          <stop offset="0%" stop-color="#7ff2e0" stop-opacity=".22"/>
          <stop offset="100%" stop-color="#7ff2e0" stop-opacity="0"/>
        </radialGradient>
      </defs>

      <!-- room -->
      <rect x="18" y="10" width="584" height="86" fill="url(#wallg)" rx="6"/>
      <rect x="18" y="94" width="584" height="224" fill="url(#floorg)" rx="6"/>
      <line x1="18" y1="94" x2="602" y2="94" stroke="#5a4232" stroke-width="2"/>
      <g stroke="#2e211a" stroke-width="1" opacity=".55">
        <line x1="18" y1="150" x2="602" y2="150"/>
        <line x1="18" y1="206" x2="602" y2="206"/>
        <line x1="18" y1="262" x2="602" y2="262"/>
      </g>
      <rect x="96" y="112" width="452" height="176" rx="10" fill="#7c3b52" opacity=".22"/>
      <rect x="108" y="122" width="428" height="156" rx="8" fill="none"
            stroke="#c9788f" stroke-width="1" opacity=".3"/>

      <!-- night window, because this thing mostly runs late -->
      <g class="window">
        <rect x="360" y="24" width="190" height="56" rx="4" fill="#061a24" stroke="#1b5064"/>
        <line x1="455" y1="24" x2="455" y2="80" stroke="#1b5064"/>
        <circle class="moon" cx="520" cy="40" r="7" fill="#cfeef0" opacity=".65"/>
        <g class="stars">
          <circle cx="385" cy="38" r="1.1" fill="#cfeef0"/>
          <circle cx="410" cy="55" r="1"   fill="#cfeef0"/>
          <circle cx="432" cy="33" r="1.2" fill="#cfeef0"/>
          <circle cx="480" cy="62" r="1"   fill="#cfeef0"/>
        </g>
      </g>

      <!-- door: everyone arrives through here -->
      <g class="door">
        <rect x="34" y="30" width="46" height="64" rx="3" fill="#6b4a2f" stroke="#8d6640"/>
        <rect x="38" y="36" width="38" height="24" rx="2" fill="#2a4a5c" opacity=".7"/>
        <circle cx="72" cy="64" r="2.6" fill="#ffd166"/>
        <text x="57" y="22" class="sign" text-anchor="middle">IN</text>
      </g>

      <!-- clock and pinboard: a wall with nothing on it reads as a placeholder -->
      <g class="clock" transform="translate(180,52)">
        <circle r="13" fill="#0d2b38" stroke="#c9788f" stroke-width="1.5"/>
        <line class="hand-h" x1="0" y1="0" x2="0" y2="-6" stroke="#ffd166" stroke-width="1.6"
              stroke-linecap="round"/>
        <line class="hand-m" x1="0" y1="0" x2="0" y2="-9.5" stroke="#eafffb" stroke-width="1.2"
              stroke-linecap="round"/>
      </g>
      <g class="board" transform="translate(240,32)">
        <rect width="86" height="46" rx="3" fill="#6b4a2f" stroke="#8d6640"/>
        <rect x="7" y="7" width="22" height="16" rx="1" fill="#ffd166" opacity=".85"/>
        <rect x="34" y="7" width="22" height="16" rx="1" fill="#7fd1ae" opacity=".85"/>
        <rect x="61" y="7" width="18" height="16" rx="1" fill="#c9788f" opacity=".85"/>
        <rect x="7" y="28" width="30" height="11" rx="1" fill="#8ab4f8" opacity=".8"/>
        <rect x="42" y="28" width="37" height="11" rx="1" fill="#ff9b8f" opacity=".7"/>
      </g>

      <!-- a couple of plants, purely so it looks like somewhere -->
      <g class="plant" transform="translate(572,300)">
        <rect x="-9" y="0" width="18" height="14" rx="2" fill="#123c4e"/>
        <path d="M0 0 C -12 -14 -8 -26 0 -30 C 8 -26 12 -14 0 0 Z" fill="#2b6b52"/>
      </g>
      <g class="plant" transform="translate(44,300)">
        <rect x="-8" y="0" width="16" height="12" rx="2" fill="#123c4e"/>
        <path d="M0 0 C -10 -12 -7 -22 0 -25 C 7 -22 10 -12 0 0 Z" fill="#2b6b52"/>
      </g>

      <g id="desks"></g>
      <g id="people"></g>
    </svg>
  </div>

  <div class="console">
    <textarea id="task" placeholder="Describe the task. Octopus works out what kind of work it is and how many agents it needs.">Migrate our billing monolith to microservices: assess the risks, write the extraction code for the invoice module, plan the cutover, and draft the customer announcement.</textarea>
    <div class="bar">
      <div class="hint" id="hint">it reads the task and sizes the swarm itself — nothing to pick</div>
      <button class="ghost" id="mic" title="Dictate a task">🎤 Speak</button>
      <button class="ghost" id="vmode" title="When to read answers aloud">🔊 auto</button>
      <button class="ghost" id="newsess" title="Forget this conversation and drop the queue">New session</button>
      <button class="go" id="go">Dispatch</button>
    </div>
    <div class="why" id="why"></div>
    <div class="memo" id="hintlive"></div>
    <div class="queue" id="queue"></div>
  </div>

  <div class="results" id="results"></div>

  <details class="cat">
    <summary>Verified models &amp; role bindings</summary>
    <div class="fam" id="cat"></div>
  </details>
</div>

<script>
const API = location.protocol === "file:" ? "http://127.0.0.1:8000" : "";

// Every agent currently on screen, keyed by run-id + agent-id so two concurrent
// tangles cannot collide. This is the single source the studio is drawn from.
const A = new Map();
let started = 0, timer = null, waves = 0;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const ROLES = ["writer","coder","scheduler","imager","analyst"];

/* ---------- ambient motes ---------- */
(function motes(){
  const box = $("motes");
  for (let i = 0; i < 26; i++) {
    const m = document.createElement("div");
    m.className = "mote";
    const s = 1 + Math.random() * 2.4;
    m.style.cssText = `width:${s}px;height:${s}px;left:${Math.random()*100}%;
      bottom:-5vh;animation-duration:${16+Math.random()*22}s;
      animation-delay:${-Math.random()*30}s;opacity:${.2+Math.random()*.5}`;
    box.appendChild(m);
  }
})();

/* ---------- the studio ----------
   Desks are laid out in two rows and handed out in order, so an agent keeps the same
   seat for its whole life and the eye can follow it. Everyone enters at the door and
   walks over, which is why the position is set twice: once where they came in, once
   where they sit, with a CSS transition doing the walk. */
const DOOR = {x: 57, y: 104};
const SEATS = [];
for (let row = 0; row < 2; row++) {
  for (let col = 0; col < 5; col++) {
    SEATS.push({x: 132 + col * 96, y: 132 + row * 74});
  }
}

function seatFor(i) {
  // More agents than desks is possible (24 is the ceiling). Extras share the floor in a
  // third row rather than vanishing.
  if (i < SEATS.length) return SEATS[i];
  const k = i - SEATS.length;
  return {x: 132 + (k % 5) * 96, y: 272};
}

function drawDesk(id, seat, colour) {
  const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
  g.id = "desk-" + id;
  g.setAttribute("class", "desk");
  g.setAttribute("transform", `translate(${seat.x},${seat.y})`);
  g.style.color = colour;
  g.innerHTML =
    `<rect class="top" x="-30" y="6" width="60" height="8" rx="2"/>` +
    `<rect class="leg" x="-26" y="14" width="4" height="14"/>` +
    `<rect class="leg" x="22" y="14" width="4" height="14"/>` +
    `<rect class="mon" x="-13" y="-14" width="26" height="19" rx="2"/>` +
    `<rect class="glare" x="-11" y="-12" width="22" height="15" rx="1"/>` +
    // props, so a desk reads as somebody's desk rather than a rectangle
    `<rect class="paper" x="16" y="2" width="11" height="5" rx="1"/>` +
    `<rect class="mug" x="-27" y="-1" width="6" height="7" rx="1.5"/>`;
  $("desks").appendChild(g);
  return g;
}

function drawPerson(id, colour) {
  const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
  g.id = "who-" + id;
  g.setAttribute("class", "person");
  g.style.color = colour;
  // Starts at the door. The transform is replaced a frame later and the transition walks.
  g.setAttribute("transform", `translate(${DOOR.x},${DOOR.y})`);
  g.innerHTML =
    `<ellipse class="pool" cx="0" cy="4" rx="34" ry="16"/>` +
    `<ellipse class="shadow" cx="0" cy="20" rx="11" ry="3.5"/>` +
    `<rect class="chair" x="-9" y="6" width="18" height="13" rx="4"/>` +
    `<path class="arm2" d="M-6 8 L-11 15"/>` +
    `<path class="arm2" d="M6 8 L11 15"/>` +
    `<rect class="torso" x="-7" y="2" width="14" height="17" rx="6"/>` +
    `<circle class="head" cx="0" cy="-4" r="6"/>` +
    `<path class="hair" d="M-6 -5 A6 6 0 0 1 6 -5 L6 -7 A6 6 0 0 0 -6 -7 Z"/>` +
    `<text class="mark" x="13" y="-6"></text>` +
    `<text class="tag" x="0" y="34" text-anchor="middle"></text>` +
    `<text class="prov2" x="0" y="43" text-anchor="middle"></text>`;
  $("people").appendChild(g);
  return g;
}

function layout() {
  const ids = [...A.keys()];
  ids.forEach((id, i) => {
    const a = A.get(id);
    const seat = seatFor(i);
    let person = document.getElementById("who-" + id);
    if (!person) {
      drawDesk(id, seat, a.color);
      person = drawPerson(id, a.color);
      // Next frame, so the browser has painted them at the door before the walk starts.
      requestAnimationFrame(() => requestAnimationFrame(() => {
        person.setAttribute("transform", `translate(${seat.x},${seat.y - 14})`);
      }));
    }
    const state = a.status === "queued" ? "" : a.status;
    person.setAttribute("class", "person " + state);
    document.getElementById("desk-" + id)?.setAttribute("class", "desk " + state);

    const tag = person.querySelector(".tag");
    const prov = person.querySelector(".prov2");
    const mark = person.querySelector(".mark");
    // Names get shorter as the room fills; past a dozen people they would just overlap.
    tag.textContent = ids.length > 12 ? a.role.slice(0, 5)
                    : (a.label || a.role).slice(0, 15);
    prov.textContent = ids.length > 12 ? "" : (a.provider || "");
    prov.setAttribute("fill", a.provider === "local" ? "#8ab4f8"
                            : a.provider === "gemini" ? "#c9a6ff" : "#a8e63a");
    mark.textContent = a.status === "done" ? "✓" : a.status === "failed" ? "✕" : "";
    mark.setAttribute("fill", a.status === "failed" ? "#ff9b8f" : "#9fe86a");
  });
  metrics();
}

function metrics() {
  const all = [...A.values()];
  $("m-agents").textContent = all.length;
  $("m-live").textContent = all.filter(a => a.status === "busy").length;
  $("m-waves").textContent = waves;
  $("m-done").textContent = all.filter(a => a.status === "done").length;
  const bad = all.filter(a => a.status === "failed").length;
  $("p-failed").hidden = !bad;
  $("m-failed").textContent = bad;
  const busy = all.some(a => a.status === "busy");
  // The window brightens while anyone is working — the room's version of the
  // old halo, and the only global "something is happening" signal left.
  document.querySelector("svg.office")?.classList.toggle("working", busy);
  document.querySelectorAll(".pill")[1].classList.toggle("hot", busy);
}


/* ---------- markdown-lite ---------- */
function render(text) {
  return text.split(/```/).map((seg, i) => {
    if (i % 2) {
      const nl = seg.indexOf("\n");
      return `<pre>${esc(nl > -1 ? seg.slice(nl + 1) : seg)}</pre>`;
    }
    return esc(seg)
      .replace(/^#{1,4}\s*(.+)$/gm, "<strong>$1</strong>")
      .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/^[-*]\s+/gm, "• ");
  }).join("");
}

function renderPlan(el, raw) {
  try {
    const j = JSON.parse(raw.slice(raw.indexOf("{"), raw.lastIndexOf("}") + 1));
    if (!Array.isArray(j.items)) return false;
    el.innerHTML = `<table class="plan">${j.items.map(i => `
      <tr><td class="when">${esc(i.when || "")}</td>
          <td>${esc(i.what || "")}${i.owner ? ` <span style="color:var(--muted)">· ${esc(i.owner)}</span>` : ""}</td>
          <td class="dur">${esc(i.duration || "")}</td></tr>`).join("")}</table>` +
      (j.assumptions?.length ? `<div class="assume">Assumed: ${j.assumptions.map(esc).join(" · ")}</div>` : "");
    return true;
  } catch { return false; }
}

/* ---------- card painting ----------
   Chunks arrive far faster than the screen refreshes, and re-rendering a card's whole
   accumulated Markdown per chunk is quadratic. With eight agents streaming at once that
   starves the main thread — animations stutter and the clock drifts. Coalesce instead:
   mark the card dirty, repaint at most once per frame. */
const dirty = new Set();
let raf = null;

function paint(id) {
  const a = A.get(id), out = $("out-" + id);
  if (!a || !out) return;
  if (a.role === "scheduler" && a.status === "busy") out.textContent = "assembling the plan…";
  else if (a.role === "scheduler") { if (!renderPlan(out, a.text)) out.innerHTML = render(a.text); }
  else out.innerHTML = render(a.text);
}

function flush() {
  raf = null;
  for (const id of dirty) paint(id);
  dirty.clear();
}

function markDirty(id) {
  dirty.add(id);
  if (!raf) raf = requestAnimationFrame(flush);
}

/* Model ids are qualified — 'local:qwen2.5:7b'. The provider is already a chip of its
   own next to the name, so repeating it in the model column is just noise. Matched by
   shape rather than by a list of provider names, so a row added to the registry does not
   have to be added here too — that list had already gone stale once. */
const bare = m => (m || "").replace(/^[a-z0-9_-]+:(?=.)/, "");

/* ---------- cards ---------- */
function card(a) {
  const el = document.createElement("div");
  el.className = "card";
  el.id = "card-" + a.key;
  el.style.setProperty("--c", a.color);
  el.innerHTML = `<h3>
      <span class="who">${esc(a.label)}</span>
      <span class="role">${esc(a.role)}</span>
      ${a.provider ? `<span class="prov" data-p="${esc(a.provider)}">${esc(a.provider)}</span>` : ""}
      <span class="mdl">${esc(bare(a.model) || "—")}</span>
      <span class="ms" id="ms-${a.key}"></span>
      <button class="say" data-key="${a.key}" title="Read this answer aloud">🔊</button>
      ${a.route_why ? `<span class="rwhy">routed: ${esc(a.route_why)}</span>` : ""}
    </h3><div class="out" id="out-${a.key}"></div>`;
  // Into its own tangle, not the shared results list: with two runs going at once a
  // single flat list gives no way to tell which answer belongs to which task.
  (document.getElementById("inner-" + a.rid) || $("results")).appendChild(el);
  return el;
}

function waveBar(n, why, count) {
  const el = document.createElement("div");
  el.className = "wavebar";
  el.innerHTML = `<span>wave <b>${n}</b> · <b>${count}</b> agent${count === 1 ? "" : "s"} in parallel</span>`;
  $("results").appendChild(el);
  $("why").innerHTML = `<span class="tag">wave ${n}</span> ${esc(why)}`;
}

/* ---------- catalog ---------- */
async function loadCatalog() {
  try {
    const r = await fetch(API + "/api/catalog");
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || "catalog unavailable");
    const up = (d.providers || []).filter(p => p.usable);
    const chips = (d.providers || []).map(p =>
      `<span class="prov" data-p="${esc(p.name)}" title="${esc(p.note)}"
        style="${p.usable ? "" : "opacity:.4;filter:grayscale(1)"}">${esc(p.name)}</span>`).join(" ");
    $("stat").innerHTML = chips +
      ` · <b>${d.verified}</b> of ${d.total} models answered · routing <b>${esc(d.route_mode)}</b>` +
      ` · <a href="/console">key console</a>`;

    // Bindings are per provider now: which model a role gets depends on where the
    // router sent it, and that is decided per subtask rather than once at load.
    const binds = Object.entries(d.bindings || {}).map(([name, rows]) =>
      `<h4>${esc(name)} bindings</h4>` + rows.map(t =>
        `<div class="binding">${esc(t.name)} → <b>${esc(bare(t.model) || "—")}</b>
          <span>(${esc(t.bound_via)})</span></div>`).join("")).join("");

    $("cat").innerHTML =
      `<h4>providers</h4>` + (d.providers || []).map(p =>
        `<div class="binding">${esc(p.label)} → <b>${esc(p.state)}</b>
          <span>${esc(p.note)}</span></div>`).join("") +
      binds +
      `<h4>verified · ${d.live.length}</h4><ul>${d.live.map(m => `<li>${esc(m)}</li>`).join("")}</ul>` +
      Object.entries(d.families).map(([f, models]) =>
        `<h4>${f} · ${models.length}</h4><ul>${models.map(m => `<li>${esc(m)}</li>`).join("")}</ul>`).join("");
  } catch (err) {
    $("stat").textContent = err.message;
  }
}

/* ---------- voice ----------
   Speech both ways, served by the local Piper and Whisper models. The mic uses the
   browser's own MediaRecorder, so capture costs no dependency; whatever container it
   produces is fine because the server decodes through PyAV. */
let REC = null, CHUNKS = [];

/* Matches the chat doors: 'auto' speaks only when the task was dictated, which is the
   rule a conversation already follows. Kept here because the page streams /api/dispatch
   directly rather than going through chat_bridge, so it has to apply the rule itself. */
let VMODE = localStorage.getItem("octopus.voice") || "auto";
let DICTATED = false;                 // was the task in flight spoken rather than typed?

function paintVmode() {
  $("vmode").textContent = {auto: "🔊 auto", on: "🔊 always", off: "🔇 off"}[VMODE];
  $("vmode").title = {
    auto: "Reads answers aloud only when you dictated the task",
    on: "Reads every answer aloud",
    off: "Never reads answers aloud"
  }[VMODE];
}
paintVmode();

$("vmode").onclick = () => {
  VMODE = {auto: "on", on: "off", off: "auto"}[VMODE];
  localStorage.setItem("octopus.voice", VMODE);
  paintVmode();
};

async function say(text) {
  if (!text) return;
  try {
    const r = await fetch(API + "/api/voice/speak", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({text})
    });
    if (!r.ok) return;
    // Queued rather than overlapped: several agents finish close together, and three
    // voices talking at once is worse than silence.
    SPEAKQ.push(await r.blob());
    drainSpeech();
  } catch { /* speech is an extra; never let it break a run */ }
}

const SPEAKQ = [];
let SPEAKING = false;
function drainSpeech() {
  if (SPEAKING || !SPEAKQ.length) return;
  SPEAKING = true;
  const audio = new Audio(URL.createObjectURL(SPEAKQ.shift()));
  audio.onended = audio.onerror = () => { SPEAKING = false; drainSpeech(); };
  audio.play().catch(() => { SPEAKING = false; });
}

$("results").addEventListener("click", async e => {
  const btn = e.target.closest(".say");
  if (!btn) return;
  const a = A.get(btn.dataset.key);
  if (!a || !a.text) return;
  btn.textContent = "…";
  try {
    const r = await fetch(API + "/api/voice/speak", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({text: a.text})
    });
    if (!r.ok) throw new Error((await r.json()).detail || r.statusText);
    const audio = new Audio(URL.createObjectURL(await r.blob()));
    audio.play();
    btn.textContent = "🔊";
  } catch (err) {
    btn.textContent = "⚠";
    btn.title = err.message;
  }
});

$("mic").onclick = async () => {
  if (REC && REC.state === "recording") { REC.stop(); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({audio: true});
    CHUNKS = [];
    REC = new MediaRecorder(stream);
    REC.ondataavailable = ev => CHUNKS.push(ev.data);
    REC.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      $("mic").classList.remove("rec");
      $("mic").textContent = "⏳ …";
      const form = new FormData();
      form.append("audio", new Blob(CHUNKS), "speech.webm");
      try {
        const r = await fetch(API + "/api/voice/listen", {method: "POST", body: form});
        const d = await r.json();
        if (!r.ok) throw new Error(d.detail || r.statusText);
        // Into the box rather than straight to dispatch: transcription is not perfect,
        // and a task worth running is worth glancing at first.
        $("task").value = d.text;
        $("task").focus();
        DICTATED = true;          // answer in the medium the task arrived in
      } catch (err) {
        $("why").innerHTML = `<span class="fail">${esc(err.message)}</span>`;
      }
      $("mic").textContent = "🎤 Speak";
    };
    REC.start();
    $("mic").classList.add("rec");
    $("mic").textContent = "⏹ Stop";
  } catch (err) {
    $("why").innerHTML = `<span class="fail">microphone unavailable: ${esc(err.message)}</span>`;
  }
};

/* ---------- session ----------
   The browser gets the same session store as the Discord and WhatsApp doors, keyed by an
   id it keeps in localStorage. That is what makes "now make that shorter" work here too,
   and why New Session is a real action rather than just clearing the screen. */
const SESSION_KEY = "octopus.session";
let SESSION = localStorage.getItem(SESSION_KEY);
if (!SESSION) {
  SESSION = "web-" + Math.random().toString(36).slice(2, 10);
  localStorage.setItem(SESSION_KEY, SESSION);
}

/* Queued tasks, client side. A dispatch streams over one connection for minutes, so the
   queue lives here and feeds that connection one task at a time — the same sequential
   rule the chat doors follow, and for the same reason: two runs at once would interleave
   their cards with no way to tell them apart. */
const QUEUE = [];
let LIVE = 0;                        // tangles currently running

function paintQueue() {
  const box = $("queue");
  box.innerHTML = QUEUE.map((task, i) =>
    `<div class="q"><b>${i + 1}</b><span>${esc(task.slice(0, 110))}</span>` +
    `<span class="drop" data-i="${i}" title="Remove">✕</span></div>`).join("");
  box.querySelectorAll(".drop").forEach(el => {
    el.onclick = () => { QUEUE.splice(+el.dataset.i, 1); paintQueue(); };
  });
  $("go").textContent = QUEUE.length ? `Dispatch (+${QUEUE.length} waiting)` : "Dispatch";
  $("hintlive").textContent = LIVE ? `${LIVE} tangle${LIVE === 1 ? "" : "s"} running` : "";
}

async function refreshMemo() {
  try {
    const d = await (await fetch(API + "/api/session/" + SESSION)).json();
    const n = (d.turns || []).length;
    $("hint").innerHTML = n
      ? `session <b>${esc(SESSION)}</b> · remembers ${n} task${n === 1 ? "" : "s"}`
      : "it reads the task and sizes the swarm itself — nothing to pick";
  } catch { /* the hint is decoration; never let it break dispatching */ }
}

$("newsess").onclick = async () => {
  try { await fetch(API + "/api/session/" + SESSION + "/new", {method: "POST"}); } catch {}
  SESSION = "web-" + Math.random().toString(36).slice(2, 10);
  localStorage.setItem(SESSION_KEY, SESSION);
  QUEUE.length = 0;
  paintQueue();
  $("results").innerHTML = "";
  $("desks").innerHTML = "";
  $("people").innerHTML = "";
  A.clear(); waves = 0; RID = 0; started = 0;
  clearInterval(timer);
  layout();
  $("why").innerHTML = `<span class="tag">new session</span> previous conversation forgotten`;
  refreshMemo();
};

/* ---------- dispatch ----------
   Several tasks can be in flight at once, each with its own tangle. Every agent id the
   server emits ('writer-1') is only unique within its own run, so everything the DOM and
   the limb map key on is prefixed with a run id — without that, a second concurrent run
   would overwrite the first one's cards. */
let RID = 0;
// Matches CHAT_MAX_CONCURRENT server-side. Not unbounded: every agent in every
// tangle competes for the same provider rate limits.
const MAX_CONCURRENT = 3;

function openTangle(task) {
  const rid = "r" + (++RID);
  const sec = document.createElement("section");
  sec.className = "tangle live";
  sec.id = "tangle-" + rid;
  sec.innerHTML = `<h2><span class="tno">tangle ${RID}</span>` +
    `<span>${esc(task.slice(0, 120))}</span>` +
    `<span class="tstate" id="tstate-${rid}">starting…</span></h2>` +
    `<div class="inner" id="inner-${rid}"></div>`;
  $("results").prepend(sec);
  return rid;
}

function tstate(rid, text) {
  const el = document.getElementById("tstate-" + rid);
  if (el) el.textContent = text;
}

async function runOne(task) {
  const rid = openTangle(task);
  started = started || Date.now();
  clearInterval(timer);
  timer = setInterval(() => {
    $("m-time").textContent = Math.round((Date.now() - started) / 1000) + "s";
  }, 250);
  try {
    const r = await fetch(API + "/api/dispatch", {
      method: "POST", headers: {"Content-Type": "application/json"},
      // no role selection: the planner decides. `session` is what gives it memory.
      body: JSON.stringify({task, session: SESSION})
    });
    if (!r.ok) throw new Error(`HTTP ${r.status}: ${(await r.text()).slice(0, 200)}`);
    await consume(r, rid);
  } catch (err) {
    tstate(rid, "failed");
    const box = document.getElementById("inner-" + rid);
    if (box) box.innerHTML = `<span class="fail">${esc(err.message)}</span>`;
  }
  document.getElementById("tangle-" + rid)?.classList.remove("live");
  metrics();
  refreshMemo();
}

/* Starts as many tangles as the queue holds, up to MAX_CONCURRENT. Not unbounded: every
   agent inside every tangle still competes for the same provider rate limits, and past a
   point more concurrency just means more 429s and slower answers for all of them. */
function pump() {
  while (LIVE < MAX_CONCURRENT && QUEUE.length) {
    const task = QUEUE.shift();
    LIVE++;
    paintQueue();
    runOne(task).finally(() => {
      LIVE--;
      paintQueue();
      pump();                       // a finished tangle makes room for a queued one
    });
  }
  paintQueue();
}

async function consume(r, rid) {
  const K = id => rid + '-' + id;   // namespace ids so tangles cannot collide
    const reader = r.body.getReader(), dec = new TextDecoder();
    let buf = "";
    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream: true});
      const lines = buf.split("\n"); buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith("data:")) continue;
        let e; try { e = JSON.parse(line.slice(5)); } catch { continue; }

        if (e.event === "status") {
          // Cold-catalog verification can take most of a minute. Saying so beats an
          // empty screen, which reads as a hung app.
          $("why").innerHTML = `<span class="tag">working</span> ${esc(e.detail)}`;
        }
        else if (e.event === "providers") {
          // Sent once, before wave 1, so the run states up front where it can send work.
          const up = e.providers.filter(p => p.usable).map(p => p.name);
          $("why").innerHTML = `<span class="tag">routing ${esc(e.mode)}</span> ` +
            `dispatching across ${up.map(n => `<b>${esc(n)}</b>`).join(" + ") || "nothing"}`;
        }
        else if (e.event === "wave") {
          waves = e.n;
          waveBar(e.n, e.why, e.agents.length);
          tstate(rid, `wave ${e.n} · ${e.agents.length} agent(s)`);
          for (const g of e.agents) {
            A.set(K(g.id), {...g, key: K(g.id), rid, status: "queued", text: ""});
            card(A.get(K(g.id)));
          }
          layout();
        }
        else if (e.event === "start") {
          const a = A.get(K(e.id)); if (!a) continue;
          a.status = "busy";
          $("card-" + K(e.id))?.classList.add("busy");
          layout();
        }
        else if (e.event === "searching") {
          const card = $("card-" + K(e.id));
          if (card && !card.querySelector(".srcs")) {
            const d = document.createElement("div");
            d.className = "srcs"; d.id = "srcs-" + K(e.id);
            d.innerHTML = `<b>web</b> · ${esc(e.detail || "searching…")}`;
            card.querySelector("h3").after(d);
          }
        }
        else if (e.event === "sources") {
          const box = $("srcs-" + K(e.id));
          if (box) {
            const list = (e.sources || []).map(s2 =>
              `<a href="${esc(s2.url)}" target="_blank" rel="noopener noreferrer">${esc(s2.title || s2.url)}</a>`).join("");
            const bad = (e.failed || []).length
              ? `<div class="miss">${e.failed.length} link(s) unreadable</div>` : "";
            box.innerHTML = (e.sources || []).length
              ? `<b>read ${e.sources.length} source(s)</b>${list}${bad}`
              : `<span class="miss">${esc(e.detail || "no sources")}</span>${bad}`;
          }
        }
        else if (e.event === "chunk") {
          const a = A.get(K(e.id)); if (!a) continue;
          a.text += e.text;
          markDirty(K(e.id));
        }
        else if (e.event === "image") {
          $("out-" + K(e.id)).innerHTML = `<img src="${e.image}" alt="generated image">`;
          $("ms-" + K(e.id)).textContent = e.latency_ms + " ms";
        }
        else if (e.event === "done") {
          const a = A.get(K(e.id)); if (!a) continue;
          a.status = "done"; a.ms = e.latency_ms;
          $("card-" + K(e.id))?.classList.remove("busy");
          $("ms-" + K(e.id)).textContent = e.latency_ms + " ms";
          dirty.delete(K(e.id));
          paint(K(e.id));          // final paint, including the scheduler's plan table
          layout();
          if (VMODE === "on" || (VMODE === "auto" && DICTATED)) say(a.text);
        }
        else if (e.event === "error") {
          const a = A.get(K(e.id)); if (!a) continue;
          a.status = "failed";
          dirty.delete(K(e.id));
          $("card-" + K(e.id))?.classList.remove("busy");
          $("out-" + K(e.id)).innerHTML = `<span class="fail">${esc(e.detail)}</span>`;
          layout();
        }
        else if (e.event === "rebind") {
          $("why").innerHTML = `<span class="tag">re-bound</span> dropped ` +
            `${esc(e.dropped)} — retrying on another model`;
        }
        else if (e.event === "fatal") {
          $("why").innerHTML = `<span class="fail">${esc(e.detail)}</span>`;
        }
        else if (e.event === "complete") {
          const secs = Math.round((Date.now() - started) / 1000);
          tstate(rid, `${e.ok} ok${e.failed ? `, ${e.failed} failed` : ""} · ${e.agents} agent(s)`);
          $("m-time").textContent = secs + "s";
          const split = Object.entries(e.by_provider || {})
            .map(([n, c]) => `${c} ${n}`).join(" + ");
          // Tokens are estimated (agents stream, so no usage block comes back) and every
          // provider here is free — so show the count, and only show money once
          // something billable is actually in the run.
          const c = e.cost || {};
          const spend = c.tokens
            ? ` · ~${c.tokens.toLocaleString()} tok${c.billable ? ` · $${c.usd.toFixed(4)}` : " · free"}`
            : "";
          $("why").innerHTML = `<span class="tag">complete</span> ` +
            `${e.agents} agent${e.agents === 1 ? "" : "s"} across ${e.waves} ` +
            `wave${e.waves === 1 ? "" : "s"} · ${e.ok} succeeded` +
            (e.failed ? ` · ${e.failed} failed` : "") +
            (split ? ` · ${split}` : "") + spend + ` · ${secs}s`;
        }
      }
    }
}

/* Dispatch never blocks now: it appends to the queue and lets the pump drain it, so
   a second task can be written while the first is still running. */
$("go").onclick = () => {
  const task = $("task").value.trim();
  if (!task) return;
  QUEUE.push(task);
  $("task").value = "";
  paintQueue();
  pump();
};

// Typing over a dictated task means it is no longer a dictated task.
$("task").addEventListener("input", () => { if (!REC) DICTATED = false; });

$("task").addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter") $("go").click();
});

loadCatalog();
</script>
